<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一加AI · 下游接入示例</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18322c;background:#f0f4f1}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:40px auto;padding:24px}header{margin-bottom:28px}h1{font-size:28px;margin-bottom:8px}.muted{color:#62756e;font-size:14px}section{padding:24px;background:white;border:1px solid #d6e1da;border-radius:16px;margin-bottom:20px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;border-radius:8px;padding:12px;border:1px solid #becfc4}input,textarea{flex:1;min-width:160px}textarea{width:100%;resize:vertical;display:block;margin:16px 0}button{cursor:pointer;background:#17654e;color:white;border-color:#17654e}button.secondary{background:white;color:#17654e}button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;word-break:break-word;background:#f3f6f4;padding:16px;border-radius:8px;max-height:230px;overflow:auto}#messages{max-height:420px;overflow:auto}.message{padding:14px 0;border-bottom:1px solid #e4eae6;white-space:pre-wrap;overflow-wrap:anywhere}.role{display:block;font-weight:650;font-size:12px;margin-bottom:6px;color:#62756e}#status{min-height:24px;white-space:pre-wrap;color:#a13827}#app[hidden],#login[hidden],button[hidden]{display:none}@media(max-width:600px){main{margin:0;padding:16px}section{padding:18px}.row>*{width:100%}}
</style></head><body><main>
<header><div class="muted">一加AI中台 / 开发者示例</div><h1>从登录到第一条流式回复</h1><div class="muted">托管凭证保存在示例服务端内存。本地联调使用 WireMock；实际模型由所接平台配置决定。</div></header>
<section id="login"><h2>登录下游应用</h2><form id="loginForm"><div class="row"><input id="identifier" autocomplete="username" placeholder="邮箱或手机号" required><input id="password" type="password" autocomplete="current-password" placeholder="密码" required><button id="loginButton">登录</button></div></form><p><button id="demo" class="secondary" hidden>使用本地演示账号</button></p><div class="muted">需要已有账号和有效 TOKEN 套餐。示例不会创建账号、购买套餐或发放额度。</div></section>
<div id="app" hidden><section><div class="row"><strong>模型</strong><select id="model"></select><button id="refresh" class="secondary">刷新额度</button><button id="logout" class="secondary">退出示例</button></div><details><summary>当前 Key 的实时额度</summary><pre id="quota"></pre></details></section>
<section><div id="messages" aria-live="polite"></div><form id="chatForm"><textarea id="prompt" rows="3" placeholder="输入一条消息，验证流式响应……" required></textarea><div class="row"><button id="send">发送</button><button id="stop" type="button" class="secondary" disabled>停止生成</button><button id="clear" type="button" class="secondary">清空对话</button></div></form></section></div>
<div id="status" role="status"></div><p class="muted">本示例每次携带完整对话历史；发生不确定的网络错误后，请先查询用量，再决定是否重发。</p>
<script type="module">
const $=id=>document.getElementById(id);let history=[],abort,loggedIn=false;const status=text=>$('status').textContent=text;
async function call(path,options={}){const r=await fetch(path,options);if(!r.ok){let b;try{b=await r.json()}catch{};throw new Error(`${b?.error?.message||`HTTP ${r.status}`} [${b?.error?.code||'http_error'}]${b?.retry_after?`，建议等待 ${b.retry_after} 秒`:''}${b?.request_id?`，请求 ID：${b.request_id}`:''}`)}return r}
async function refresh(){const r=await call('/api/quota');$('quota').textContent=JSON.stringify(await r.json(),null,2)}
async function enter(){const models=await(await call('/api/models')).json();$('model').replaceChildren();for(const m of models.data||[]){const o=document.createElement('option');o.value=m.id;o.textContent=m.id;$('model').append(o)}if(!$('model').options.length)throw new Error('当前套餐没有可用模型');loggedIn=true;$('login').hidden=true;$('app').hidden=false;await refresh();status('')}
async function login(path,body){$('loginButton').disabled=$('demo').disabled=true;status('正在登录并获取托管凭证……');try{await call(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('password').value='';await enter()}catch(e){status(e.message)}finally{$('loginButton').disabled=$('demo').disabled=false}}
$('loginForm').onsubmit=e=>{e.preventDefault();login('/api/login',{identifier:$('identifier').value,password:$('password').value})};$('demo').onclick=()=>login('/api/demo-login',{});
$('refresh').onclick=()=>refresh().catch(e=>status(e.message));$('logout').onclick=async()=>{abort?.abort();try{await call('/api/logout',{method:'POST'});location.reload()}catch(e){status(e.message)}};
function message(role,text=''){const d=document.createElement('div');d.className='message';const label=document.createElement('span');label.className='role';label.textContent=role;const content=document.createElement('span');content.textContent=text;d.append(label,content);$('messages').append(d);return content}
$('clear').onclick=()=>{if(abort)return;history=[];$('messages').replaceChildren();status('')};$('model').onchange=()=>{history=[];$('messages').replaceChildren()};$('stop').onclick=()=>abort?.abort();
$('chatForm').onsubmit=async e=>{e.preventDefault();if(abort||!loggedIn)return;const text=$('prompt').value.trim();if(!text)return;const user={role:'user',content:text};message('你',text);const output=message('模型');abort=new AbortController();$('send').disabled=true;$('stop').disabled=false;$('clear').disabled=$('model').disabled=true;status('正在生成……');let answer='',terminal=false,finishReason,doneSeen=false;try{const r=await call('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value,messages:[...history,user]}),signal:abort.signal});const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{value,done}=await reader.read();buffer+=decoder.decode(value,{stream:!done});let end;while((end=buffer.indexOf('\n\n'))!==-1){const frame=buffer.slice(0,end);buffer=buffer.slice(end+2);const data=frame.split('\n').filter(l=>l.startsWith('data:')).map(l=>l.slice(5).trimStart()).join('\n');if(!data)continue;if(data==='[DONE]'){doneSeen=true;continue}const event=JSON.parse(data);if(event.error)throw new Error(`${event.error.message} [${event.error.code}]${event.request_id?`，请求 ID：${event.request_id}`:''}`);for(const c of event.choices||[]){answer+=c.delta?.content||'';if(c.finish_reason){terminal=true;finishReason=c.finish_reason}}output.textContent=answer;$('messages').scrollTop=$('messages').scrollHeight}if(done)break}if(!doneSeen||(!terminal&&!answer))throw new Error('连接在终态确认前关闭，请先检查用量');history.push(user,{role:'assistant',content:answer});status(finishReason==='length'?'回复已达到输出上限，可继续提问。':'生成完成。')}catch(err){status(err.name==='AbortError'?'已停止生成；部分输出可能已计量。':err.message)}finally{abort=undefined;$('send').disabled=false;$('stop').disabled=true;$('clear').disabled=$('model').disabled=false;$('prompt').value='';refresh().catch(()=>{})}};
try{const s=await(await call('/api/session')).json();$('demo').hidden=!s.localDemo;if(s.loggedIn)await enter()}catch(e){status(e.message)}
</script></main></body></html>
