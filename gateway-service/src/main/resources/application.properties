# 公网匿名读图：让厂商（天翼）能拉到客户端上传回来的参考图，用于图生图 / 图层拆分。
# 客户端上传走既有的 POST /v1/files 拿到 file_id，生图时用 image_file_id 提交；
# 网关把它现签成一个短时效的公网地址交给厂商。
#
# secret 为空 = 功能关闭（默认）：/v1/files/{id}/content 一律 404、
# 生图的 image_file_id 一律 501，图生图退回「调用方自备公网图片 URL」。
# 这条默认值是刻意的——没配好密钥的公网读图端点就是一个可枚举的下载口。
gateway.files.content-token.secret=${GATEWAY_FILES_CONTENT_TOKEN_SECRET:}
gateway.files.content-token.ttl=${GATEWAY_FILES_CONTENT_TOKEN_TTL:10m}
gateway.files.content-token.public-base-url=${GATEWAY_PUBLIC_BASE_URL:https://api.yuzhh.com}
gateway.files.content-token.max-bytes=${GATEWAY_FILES_CONTENT_TOKEN_MAX_BYTES:20971520}
# 匿名读图端点的按 IP 限流。设计文档把它列为必做项（否则会被当免费图床）：
# docs/operations/图生图方案B-网关中转设计.md:71「必须限流…超限 429」。
# 以前只有文档没有实现，也没有任何测试钉住它。
gateway.files.content-token.rate-limit-per-ip=${GATEWAY_FILES_CONTENT_TOKEN_RATE_LIMIT_PER_IP:120}
gateway.files.content-token.rate-limit-window=${GATEWAY_FILES_CONTENT_TOKEN_RATE_LIMIT_WINDOW:1m}
gateway.files.content-token.rate-limit-fail-closed=${GATEWAY_FILES_CONTENT_TOKEN_RATE_LIMIT_FAIL_CLOSED:true}

# 一次对话请求允许用的**总时间预算**，覆盖全部供应商尝试（含 failover 与重试）。
#
# 它此前只作为 @Value 的兜底默认值存在（30s），application.properties 里根本看不到这一项，
# 因此运维无法发现「所有对话都被一个 30 秒的硬墙框着」。长任务（生成一份文档、写一个页面）
# 的单轮模型调用经常超过 30 秒，于是流在写到一半时被网关自己切断 —— 客户端看到的就是
# 「长任务执行到一半流式输出断了」，而网关只是照章把上游掐断。这是配置问题，不是供应商问题。
#
# 取值依据（三层必须同向，否则短的那层先断）：
#   * nginx `proxy_read_timeout` 为 600s（见 deploy/nginx/nginx.https.conf，`^~ /v1/` 段）；
#   * 本值必须 ≤ nginx 的 600s，否则 nginx 先断、客户端拿不到网关的错误码；
#   * 必须 ≥ 渠道的 `channel.timeout_ms`（对话渠道当前 60s），否则渠道还没到自己的超时
#     就被这里掐掉，等于把渠道配置变成摆设。
#   * 也必须 ≤ 客户端超时。**客户端必须 ≥ 本值**，否则先断在客户端。
# 300s 与生图路径的预算一致（生图网关侧上限 240s、客户端建议 300s），使两条长耗时路径
# 不再各有一套口径。
#
# 调大它会同时放宽「一次请求最多占用多少额度预留时间」，改前请对照
# `gateway.chat.reservation-ttl` 与 quota.recovery.* 一并核对。
gateway.chat.total-attempt-timeout=${GATEWAY_CHAT_TOTAL_ATTEMPT_TIMEOUT:300s}

# 一次流式对话其实有两个**不同**的等待窗口，此前它们共用渠道超时（60s），
# 于是「推理模型思考 90 秒」和「上游卡死」被同一个数字判死，二选一必然错一头。
#
#   * first-token-timeout：流开始后等**第一个** token 的上限。思考与排队都算在这里。
#   * idle-timeout：两个 chunk 之间允许的最长静默。真正卡死由它收口。
#
# 两者都取 min(本值, channel.timeout_ms)：渠道配置仍是硬上限，运维只调渠道那一处
# 也不会出现「渠道说 30 秒、代码还在等 180 秒」的分歧。
# 取值依据：对话渠道 timeout_ms=180000、nginx proxy_read_timeout=600s，
# 且**客户端超时必须 ≥ 180s**，否则先断在客户端。
gateway.chat.first-token-timeout=${GATEWAY_CHAT_FIRST_TOKEN_TIMEOUT:180s}
gateway.chat.idle-timeout=${GATEWAY_CHAT_IDLE_TIMEOUT:60s}

# 流式回答期间的 SSE 注释心跳（`:keep-alive`），**只在首个 chunk 之后**生效：
# 首字之前响应尚未提交，发不出任何字节。0 或负数 = 关闭。
# 不要配得比客户端/代理的读空闲超时还长，否则等于没有。
gateway.chat.stream-heartbeat-interval=${GATEWAY_CHAT_STREAM_HEARTBEAT_INTERVAL:15s}

# 额度预留的存活时间。它是「钱包/套餐在调用供应商之前就持有的额度」的持有上限，
# 也是崩溃后能被恢复扫描收敛的时间窗。必须 ≥ total-attempt-timeout，否则一次正常的
# 长任务会在跑到一半时预留过期，恢复扫描随后按「无终态证据」处理它。
gateway.chat.reservation-ttl=${GATEWAY_CHAT_RESERVATION_TTL:10m}

