name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-gateway-unit:
    name: Backend Compile & Gateway Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile platform and gateway modules
        run: mvn -B test-compile
      - name: Run gateway unit, protocol and architecture tests
        run: >-
          mvn -B -pl gateway-service
          -Dtest="GatewayServiceApplicationTests,GatewaySchedulingConfigurationTest,com.yuzhihuihe.apiplatform.gateway.architecture.*,com.yuzhihuihe.apiplatform.gateway.billing.*,com.yuzhihuihe.apiplatform.gateway.limit.PackageRateLimitsTest,com.yuzhihuihe.apiplatform.gateway.limit.RequestLimitServiceTest,com.yuzhihuihe.apiplatform.gateway.limit.RedisRequestLimitStoreLocalTest,com.yuzhihuihe.apiplatform.gateway.openai.*,!com.yuzhihuihe.apiplatform.gateway.openai.DatabaseGatewayCatalogPublicAdmissionTest,!com.yuzhihuihe.apiplatform.gateway.openai.ChatDailyRequestLimitAdmissionTest,!com.yuzhihuihe.apiplatform.gateway.openai.ChatPackageTokenRateLimitAdmissionTest,com.yuzhihuihe.apiplatform.gateway.routing.*,!com.yuzhihuihe.apiplatform.gateway.routing.ChannelModelProbeabilityRepositoryTest,!com.yuzhihuihe.apiplatform.gateway.routing.ChannelModelTestServiceTest,!com.yuzhihuihe.apiplatform.gateway.routing.GatewayAdminServiceTest,!com.yuzhihuihe.apiplatform.gateway.routing.ModelCatalogServiceTest,com.yuzhihuihe.apiplatform.gateway.quota.*,!com.yuzhihuihe.apiplatform.gateway.quota.AudioSecondBucketSettlementTest,!com.yuzhihuihe.apiplatform.gateway.quota.PackageActivationTest,!com.yuzhihuihe.apiplatform.gateway.quota.PackageRefundServiceTest,!com.yuzhihuihe.apiplatform.gateway.quota.QuotaConcurrencyTest,!com.yuzhihuihe.apiplatform.gateway.quota.SettlementReservationBoundTest"
          test

  frontend-console:
    name: Frontend Console Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install web-console dependencies
        working-directory: web-console
        run: pnpm install --frozen-lockfile
      - name: Run web-console unit tests
        working-directory: web-console
        run: pnpm exec vitest run --exclude src/views/auth/LoginViewOAuth.spec.ts
      - name: Typecheck and build web-console
        working-directory: web-console
        run: pnpm build
