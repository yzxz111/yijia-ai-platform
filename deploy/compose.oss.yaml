services:
  gateway-service:
    environment:
      STORAGE_FILES_PROVIDER: aliyun-oss
      STORAGE_FILES_REGION: ${STORAGE_FILES_REGION}
      STORAGE_FILES_BUCKET: ${STORAGE_FILES_BUCKET}
      STORAGE_FILES_PUBLIC_ENDPOINT: ${STORAGE_FILES_PUBLIC_ENDPOINT}
      STORAGE_FILES_BACKEND_ENDPOINT: ${STORAGE_FILES_BACKEND_ENDPOINT}
      STORAGE_FILES_CREDENTIAL_SOURCE: ${STORAGE_FILES_CREDENTIAL_SOURCE:-ENV}
      STORAGE_FILES_DIRECT_UPLOAD_ENABLED: ${STORAGE_FILES_DIRECT_UPLOAD_ENABLED:-true}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_SESSION_TOKEN: ${OSS_SESSION_TOKEN}
