worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 26m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # 边缘侧的滥用兜底。Spring 服务内部的所有限流都位于一个被完整缓冲的请求体*之后*，因此没有
    # 这些限制时，未认证的调用方就能把任意请求量（以及 25 MB 的请求体）直接灌进应用的
    # 反序列化器。这里只是按来源做的粗粒度上限：真正权威的按套餐 / 按账号限额仍然在服务内部，
    # 并且刻意比这里配置的任何值都更严格。
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=callback_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=v1_zone:10m rate=1200r/m;
    # 会话维持类请求（令牌刷新、终端心跳、待审批登录轮询）由已登录的 SPA 周期性发出：单标签页
    # 约 6 次/分钟，多开标签页或同一出口 IP 下多人办公会成倍增长。它们都要求已持有令牌，不属于
    # 撞库面，所以与凭证签发分开计桶；auth_zone 继续只覆盖登录/注册/短信/重置口令。
    limit_req_zone $binary_remote_addr zone=session_zone:10m rate=600r/m;
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    upstream platform_backend {
        zone platform_backend 64k;
        server platform-service:8080 resolve;
    }

    upstream gateway_backend {
        zone gateway_backend 64k;
        server gateway-service:8080 resolve;
    }

    upstream console_frontend {
        zone console_frontend 64k;
        server web-console:8080 resolve;
    }

    server {
        listen 8080;
        server_name _;

        # 按来源的粗粒度连接数上限；对一个共用一个 NAT 出口的办公室足够宽松，同时仍能阻止单个
        # 来源耗尽 worker 连接数或文件描述符。
        limit_conn perip_conn 200;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖，绝不追加：该请求一旦来自私有代理地址，后端就会信任这个头，因此若追加
        # $proxy_add_x_forwarded_for，客户端就能把自己的条目插到真实地址之前。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # 本服务栈不使用 RFC 7239，而它默认也不会被剥离，因此这里直接丢弃，避免客户端夹带的值
        # 进入 Spring 的 forwarded-header 处理流程。
        proxy_set_header Forwarded "";

        # 基础响应加固。注意 nginx 的 add_header 不会跨层级合并：任何自行声明了 add_header 的
        # location 都必须重复这些头（参见 /v1/ 段）。
        # 这里刻意不设置 Content-Security-Policy：控制台是 SPA，未经真实打包产物验证的策略会
        # 直接弄坏界面。只有在浏览器中实测通过之后再加。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # 任何 root 都绝不提供点文件或点目录（例如 /.env、/.git）。/.well-known/ 路径被豁免，
        # 以便公开的 JWKS 端点继续可用。
        location ~ /\.(?!well-known/) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location = /health/platform {
            access_log off;
            proxy_pass http://platform_backend/actuator/health/readiness;
        }

        location = /health/gateway {
            access_log off;
            proxy_pass http://gateway_backend/actuator/health/readiness;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://platform_backend;
        }

        # 会话维持类端点：已持有令牌的正常调用，给宽松的 session_zone。
        # 这里**必须**是正则 location 且下面的凭证前缀**不能**用 ^~：^~ 会屏蔽正则，
        # 让会话轮询继续吃 60r/m 的严格桶，多标签页/同 IP 多人时就持续 429。
        location ~ ^/console/platform/auth/(refresh|terminal-presence|terminal-close|browser-close|terminal-device/validate|me|account-state|validate|logout|login-handoffs/) {
            limit_req zone=session_zone burst=120 nodelay;
            proxy_pass http://platform_backend;
        }

        # 登录 / 短信 / 验证码 / 重置口令。BCrypt cost 12 使每次口令登录都实打实消耗 CPU，
        # 所以这里是粗粒度容量限制最有价值的地方。会话维持类端点已被上面的正则取走，
        # 这个严格桶只覆盖真正的凭证签发与校验。
        location /console/platform/auth/ {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://platform_backend;
        }

        location = /console/platform/payments/wechat-pay/callback {
            access_log off;
            client_max_body_size 1m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=callback_zone burst=20 nodelay;
            proxy_pass http://platform_backend;
        }

        location = /console/platform/payments/alipay/callback {
            access_log off;
            client_max_body_size 1m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=callback_zone burst=20 nodelay;
            proxy_pass http://platform_backend;
        }

        location = /console/platform/payments/mock/callback {
            access_log off;
            client_max_body_size 1m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=callback_zone burst=20 nodelay;
            proxy_pass http://platform_backend;
        }

        location = /console/platform/refunds/wechat-pay/callback {
            access_log off;
            client_max_body_size 1m;
            proxy_request_buffering off;
            proxy_buffering off;
            limit_req zone=callback_zone burst=20 nodelay;
            proxy_pass http://platform_backend;
        }

        location ^~ /console/platform/ {
            proxy_pass http://platform_backend;
        }

        # 已发布的服务条款 / 隐私政策。登录页在会话建立之前就要读取它们，因此它们位于
        # /console/platform/ 之外（该前缀需要认证），并且需要在 SPA 兜底路由之前有自己的路由。
        location ^~ /console/legal/ {
            proxy_pass http://platform_backend;
        }

        # 技能（Skill）管理控制台（POST/PUT 上传不超过 200 MB 的包，外加小图标上传）。
        # 该前缀刻意不带结尾斜杠：列表端点是父路径（`/console/gateway/admin/skills`），
        # 所以 `/…/skills/` 这样的 location 会让列表请求落到下面通用的 `^~ /console/gateway/` 段。
        # 它仍然能胜过那一段，因为更长的前缀 location 会先被选中，从而把 210m 的请求体上限与放宽的
        # 上传超时只限定在本端点范围内。
        location ^~ /console/gateway/admin/skills {
            client_max_body_size 210m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_pass http://gateway_backend;
        }

        # 原生 ClawHub 导入：接受 50 MiB 的 ZIP 加上 multipart 帧开销。
        # 代码侧上限是 ClawhubSkillAdapter.MAX_SOURCE_ZIP_BYTES = 50 MiB，这里必须比它宽，
        # 否则 25–50 MB 的包会在边缘直接被 413，而网关内部那道 50 MiB 检查永远不会被触发。
        location ^~ /console/gateway/admin/skill-source-imports/ {
            client_max_body_size 52m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_pass http://gateway_backend;
        }

        location ^~ /console/gateway/ {
            proxy_pass http://gateway_backend;
        }

        location ^~ /v1/ {
            error_page 429 = @downstream_rate_limited;
            proxy_intercept_errors off;
            # 仅按来源做的粗粒度兜底（持续 20 rps，允许短时突发）。权威限额是 gateway-service
            # 内部的套餐 RPM/TPM/并发检查，它们远比这里严格；这一段的存在只是为了让洪水在边缘
            # 就被卸掉，而不是消耗网关容量。add_header 不会继承，因此服务级加固头在这里重复一遍。
            limit_req zone=v1_zone burst=60 nodelay;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 300s;
            add_header X-Accel-Buffering no always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            proxy_pass http://gateway_backend;
        }

        # Edge rejections have the same envelope; upstream 429s keep their own code and delay.
        location @downstream_rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            return 429 '{"error":{"message":"Edge traffic limit exceeded","type":"rate_limit_error","code":"edge_rate_limit_exceeded"},"request_id":"$request_id"}';
        }

        location / {
            proxy_pass http://console_frontend;
        }
    }
}
