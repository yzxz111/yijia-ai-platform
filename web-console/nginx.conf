server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # 带内容哈希的产物：文件名变了内容才变，可以长缓存。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 入口 HTML：必须每次回源校验。
    #
    # 为什么重要：这个栈的 SPA 入口是 `/index.html`，它引用带哈希的 chunk。
    # 一旦入口被启发式缓存（此前这里没有发任何 Cache-Control），浏览器 /
    # 桌面客户端的 webview 就会一直加载**旧入口** → 拉旧 chunk → 界面看起来"还是老的"，
    # 而服务端其实已经发布了新版。这正是客户端登录窗口显示旧界面的成因之一。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
