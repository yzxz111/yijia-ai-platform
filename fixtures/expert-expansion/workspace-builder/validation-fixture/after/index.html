<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚构个人任务台</title>
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;background:#f5f7fb;color:#142033;margin:0}main{max-width:720px;margin:24px auto;padding:20px}button,input{font:inherit;padding:9px;max-width:100%}form{display:flex;gap:8px}#title{flex:1;min-width:0}li{display:flex;gap:12px;align-items:center;background:white;margin:8px 0;padding:10px}li span{flex:1;overflow-wrap:anywhere}ul{padding:0}label{display:block;margin-top:16px}:focus-visible{outline:3px solid #2458a1;outline-offset:3px}</style>
<main><h1>我的任务</h1><p id="notice">用户原有说明：数据只保存在这台浏览器，请定期导出。</p><form id="add-form"><label for="title" hidden>新任务</label><input id="title" aria-label="新任务" maxlength="120"><button type="submit">添加</button></form>
<p id="status" role="status"></p><p id="empty">暂无任务</p><ul id="tasks"></ul><button id="export" type="button">导出备份</button><label>导入备份<input id="import" type="file" accept="application/json,.json"></label></main><script src="app.js"></script></html>
